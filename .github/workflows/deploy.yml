name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The embed url parsing is the only logic worth gating a deploy on, and it
      # imports nothing — node runs the .ts file directly, so no install step here.
      # Everything else (install, astro check, build) happens on the server below.
      - run: node src/lib/embed.test.ts

      - name: trigger server-side deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # The server pulls this very commit from GitHub and builds it there — only
          # the command string travels over ssh. Pushing built files up from a runner
          # is what the old rsync step did, and that transfer stalls.
          #
          # The remote login shell is fish, so this is a plain && chain: no `set -e`
          # (that erases a variable in fish) and no { } grouping (bash-only). Any
          # failing step breaks the chain, so a bad build never reaches the rsync.
          #
          # -n keeps stdin off the remote shell so it can never sit waiting for input.
          ssh -n -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" 'cd /home/aaronabb/websites/cuteaggression-website && echo ":: 1/4 pull" && git pull --ff-only origin main && echo ":: 2/4 install" && npm install && echo ":: 3/4 build" && npm run build && echo ":: 4/4 publish" && test -d /var/www/virtual/aaronabb/www.cuteaggression.lol && rsync -av --delete dist/ /var/www/virtual/aaronabb/www.cuteaggression.lol/ && echo ":: deployed"'
