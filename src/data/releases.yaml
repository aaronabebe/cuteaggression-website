# Music. Rendered as playable embeds, newest first.
#
# spotify:     paste the normal share link (Spotify > Share > Copy Song/Album Link).
#              Works for track and album links. The embed player is derived from it.
# bandcamp:    Bandcamp needs its own numeric id, which is NOT in the page url.
#              Get it from Bandcamp > your release > Share/Embed > Embed this album,
#              then copy the number out of `album=1234567890` (or `track=...`).
#              Put that number in bandcampId, and prefix it with "track=" for tracks:
#                bandcampId: "album=1234567890"
#                bandcampId: "track=1234567890"
#              bandcampUrl is the normal page link, used for the "buy" button.
# cover:       artwork in public/, e.g. /covers/make-us-crash.jpg. Shown on the front
#              page hero instead of a player. Square images look best.
#
# Anything without an embed still renders as a plain link button, so partial info is fine.

